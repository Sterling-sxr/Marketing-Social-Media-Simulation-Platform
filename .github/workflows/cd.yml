name: CD

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare Deployment Context
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.vars.outputs.deploy_env }}
      repository_lc: ${{ steps.vars.outputs.repository_lc }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Resolve environment and image namespace
        id: vars
        shell: bash
        run: |
          repo_lc="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            deploy_env="production"
          else
            deploy_env="staging"
          fi
          echo "repository_lc=${repo_lc}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "deploy_env=${deploy_env}" >> "$GITHUB_OUTPUT"

  publish-images:
    name: Build and Publish Images
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    environment: ${{ needs.prepare.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.repository_lc }}/${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.deploy_env }}-latest
            type=raw,value=${{ needs.prepare.outputs.deploy_env }}-${{ needs.prepare.outputs.short_sha }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs:
      - prepare
      - publish-images
    steps:
      - name: Print image tags
        run: |
          echo "Environment: ${{ needs.prepare.outputs.deploy_env }}"
          echo "Backend: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.repository_lc }}/backend:${{ needs.prepare.outputs.deploy_env }}-${{ needs.prepare.outputs.short_sha }}"
          echo "Frontend: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.repository_lc }}/frontend:${{ needs.prepare.outputs.deploy_env }}-${{ needs.prepare.outputs.short_sha }}"
          echo "Remote deploy is intentionally disabled for now (no server configured)."
