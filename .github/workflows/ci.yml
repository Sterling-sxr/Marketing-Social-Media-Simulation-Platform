name: CI

on:
  # Run on pushes to any branch.
  push:
    branches:
      - "**"
  # Run on pull requests targeting any branch.
  pull_request:
    branches:
      - "**"
  # Allow manual runs from GitHub Actions.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  # Cancel older runs on the same ref to save CI time.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Lint and Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        env:
          # Use CPU-only wheels so CI does not try to pull CUDA packages.
          PIP_INDEX_URL: https://download.pytorch.org/whl/cpu
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff

      - name: Ruff lint
        # Lint backend source files.
        run: ruff check backend

      - name: Django system checks
        env:
          # Use lightweight CI settings for framework checks.
          DJANGO_SECRET_KEY: ci-secret
          DATABASE_URL: sqlite:///ci.sqlite3
        run: python backend/manage.py check

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        env:
          PIP_INDEX_URL: https://download.pytorch.org/whl/cpu
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django tests
        env:
          DJANGO_SECRET_KEY: ci-secret
          DATABASE_URL: sqlite:///ci.sqlite3
        run: python backend/manage.py test

  backend-unit-tests:
    name: Backend Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: backend-quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            tests/backend-unit/requirements.txt

      - name: Install backend and pytest dependencies
        env:
          PIP_INDEX_URL: https://download.pytorch.org/whl/cpu
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r tests/backend-unit/requirements.txt

      - name: Run backend unit tests
        working-directory: tests/backend-unit
        run: pytest

  frontend-quality:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        # Check frontend code style and common issues.
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        # Make sure the app can build in CI.
        working-directory: frontend
        run: npm run build

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/frontend-unit/package-lock.json

      - name: Install frontend unit test dependencies
        working-directory: tests/frontend-unit
        run: npm ci

      - name: Install frontend runtime deps required by unit tests
        working-directory: tests/frontend-unit
        run: npm install --no-save lucide-react recharts

      - name: Run frontend unit tests
        working-directory: tests/frontend-unit
        run: npm test

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt || true

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Frontend unit test dependency audit
        working-directory: tests/frontend-unit
        run: npm audit --audit-level=high || true

  docker-build-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        # Check that the backend image can be built successfully.
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false

      - name: Build frontend image
        # Check that the frontend image can be built successfully.
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false

  ci-summary:
    name: CI Summary Gate
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - backend-tests
      - backend-unit-tests
      - frontend-quality
      - frontend-unit-tests
      - docker-build-validation
    steps:
      - name: All required jobs passed
        run: echo "CI quality gate passed."
